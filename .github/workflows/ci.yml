name: CI

on:
  pull_request:
    branches: ["**"]
  # Also run on the default branch so a bad merge is caught even if the pull
  # request was green against a stale base.
  push:
    branches: [main, master]

permissions:
  contents: read

# One run per ref. A new push supersedes the previous run rather than queueing
# behind it — otherwise a branch pushed three times burns three full runs and
# you wait on the results of code that no longer exists.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Harness ──────────────────────────────────────────────────────────────
  # Stack-neutral and works with zero configuration. Fast, so it runs first and
  # unconditionally: a broken cross-reference should not wait behind a build.
  harness:
    name: Harness lint
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the lint uses git grep and git ls-files, and the
          # change detection below needs the merge base.
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        # Workflow context values are passed through `env:` rather than
        # interpolated into the script body. A commit SHA is not attacker-
        # controlled, but `${{ }}` inside `run:` is textual substitution — so any
        # value that ever becomes user-supplied (a branch name, a title, a
        # comment body) becomes shell injection. Using `env:` uniformly means the
        # habit is right before the value is dangerous.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="$BASE_SHA"
          if [ -z "$BASE" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD || true)
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'
          # Anything outside docs/ and markdown counts as code. Skipping the
          # heavy jobs for docs-only changes is what keeps a typo fix from
          # costing a full build — and what stops people batching doc fixes
          # into code changes to avoid the wait.
          if echo "$CHANGED" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Harness lint
        run: bash scripts/lint-docs.sh

  # ── Build and test ───────────────────────────────────────────────────────
  # Fill in for your stack. Kept as a separate job so it can run in parallel
  # with the harness lint and be skipped for docs-only changes.
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: harness
    if: needs.harness.outputs.code-changed == 'true'
    steps:
      - uses: actions/checkout@v7

      # --- Replace everything below with your stack's steps ---
      #
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version-file: .nvmrc
      #     cache: npm
      # - run: npm ci
      # - run: npx tsc --noEmit
      # - run: npm run lint
      # - run: npm test
      # - run: npm run build
      #
      # Two things worth getting right from the start:
      #
      # 1. Pin the runtime version in a file (.nvmrc, .python-version,
      #    go.mod) rather than inline here, so local and CI cannot disagree.
      #
      # 2. Give the build step every configuration value your app validates at
      #    startup. A missing one fails the build with an error that points at
      #    rendering rather than at configuration, which is a slow way to
      #    discover a typo. See docs/harness/recipes.md § 5 for a guard that
      #    catches this locally instead.

      - name: Placeholder
        run: |
          echo "No build or test steps configured yet."
          echo "Add them in .github/workflows/ci.yml, and add the matching"
          echo "local gates to the CHECKS array in scripts/check.sh."
